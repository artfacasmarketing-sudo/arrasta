<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../comum.css">
<style>
/* escuro: o modelo original do arrasta. Cores em visual.py; aqui só posição e tamanho. */
:root { --margem: 96px; }
.topo {
  position: absolute; top: 72px; left: var(--margem); right: var(--margem); height: 40px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 30px; font-weight: 600; color: var(--texto2); letter-spacing: -0.01em;
}
.zona {
  position: absolute; left: var(--margem); right: var(--margem); top: 176px; bottom: 208px;
  display: flex; flex-direction: column;
}
.capa .zona { justify-content: flex-end; }
.miolo .zona, .final .zona { justify-content: center; }
.titulo { font-weight: 800; letter-spacing: -0.035em; text-wrap: balance; }  /* linhas equilibradas: sem viúva */
.capa .titulo { font-size: 104px; line-height: 1.0; }
.miolo .titulo { font-size: 80px; line-height: 1.05; }
.final .titulo { font-size: 84px; line-height: 1.04; }
.apoio { font-size: 42px; line-height: 1.3; font-weight: 500; color: var(--texto2); margin-top: 36px; letter-spacing: -0.015em; text-wrap: pretty; }
.texto { font-size: 48px; line-height: 1.4; font-weight: 450; margin-top: 44px; letter-spacing: -0.012em; text-wrap: pretty; }
.pedido {
  margin-top: 56px; align-self: flex-start; max-width: 100%;
  background: var(--destaque); color: var(--sobre-destaque);
  font-size: 50px; line-height: 1.18; font-weight: 750; letter-spacing: -0.02em;
  padding: 34px 44px 38px; border-radius: 28px; text-wrap: balance;
}
.pedido .marca { color: inherit; text-decoration: underline; text-decoration-thickness: 5px; text-underline-offset: 8px; }
.trilho {
  position: absolute; left: var(--margem); right: var(--margem); bottom: 96px; height: 8px;
  border-radius: 4px; background: color-mix(in srgb, var(--texto2) 28%, transparent);
}
.trilho i { display: block; height: 100%; border-radius: 4px; background: var(--destaque); }
.arrasta {
  position: absolute; right: var(--margem); bottom: 128px;
  font-size: 32px; font-weight: 650; color: var(--texto); letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 12px;
}
.arrasta svg { width: 34px; height: 34px; }
</style>
</head>
<body>
<script src="../comum.js"></script>
<script>
function montar(s, meta) {
  aplicarCores(meta.cores);
  s.papel = papelDe(meta);
  document.body.className = s.papel;
  let h = '<div class="topo"><span data-id="arroba">' + esc(meta.arroba || "") + '</span>'
        + '<span data-id="contador">' + (s.papel === "capa" ? "" : meta.i + " / " + meta.n) + '</span></div>';
  h += '<div class="zona" data-caixa="zona">';
  const tag = s.papel === "capa" ? "h1" : "h2";
  h += '<' + tag + ' class="titulo" data-id="titulo">' + marcas(s.titulo) + '</' + tag + '>';
  if (s.texto) h += '<p class="' + (s.papel === "capa" ? "apoio" : "texto") + '" data-id="texto">' + marcas(s.texto) + '</p>';
  if (s.pedido) h += '<p class="pedido" data-id="pedido">' + marcas(s.pedido) + '</p>';
  h += '</div>';
  // a seta é desenho, não letra: a fonte embutida não tem "→" e cada sistema desenharia com a fonte dele
  if (s.papel === "capa") h += '<div class="arrasta" data-id="dica">arrasta<svg viewBox="0 0 24 24" aria-hidden="true">'
        + '<path d="M3 12h17M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  h += '<div class="trilho"><i style="width:' + (100 * meta.i / meta.n).toFixed(2) + '%"></i></div>';
  document.body.innerHTML = h;
}
</script>
</body>
</html>
